[project]
name = "qibao-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "httpx==0.25.2",
  "duckdb==1.3.2",
  "mootdx>=0.11,<0.12",
  "eltdx==3.3.5",
  "axdata==0.1.4",
  "pandas==2.3.1",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.20",
  "sqlalchemy==2.0.41",
  "uvicorn[standard]==0.35.0",
  "exchange-calendars==4.13.2",
  # Sec-MS-GEC v2 authentication and locale-independent server date parsing.
  "edge-tts>=7.3.1,<8",
  "pywebview>=5.4,<7",
]

[project.scripts]
xiaoqibao = "qibao_desktop.entrypoint:main"

[project.optional-dependencies]
dev = [
  "hypothesis==6.135.32",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.3",
  "pyinstaller>=6.14,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qibao_api", "src/qibao_desktop"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py312"
